<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/overzicht.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Overzicht - Accessibility Hub</title>
</head>
<body>
    <h1>Overzicht Onderzoeken</h1>
    <table>
        <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Beschikbaarheid</th>
            <th>Leeftijd van</th>
            <th>Leeftijd tot</th>
            <th style="width: 20%;">Acties</th>
        </tr>
        {%for onderzoek in onderzoeken%}
        <tr>
            <td>{{onderzoek.titel}}</td>
            <td>{{onderzoek.status}}</td>
            <td>{%if onderzoek.beschikbaar | int == 1 %} Ja 
                {%else%} Nee
                {%endif%}</td>
            <td>{{onderzoek.leeftijd_van}}</td>
            <td>{{onderzoek.leeftijd_tot}}</td>
            <td><select name="actie" id="actie" aria-label="Selecteer een van onder (keuze optie)">
                <option value="">Kies..</option>
                <option value="goedkeuren">Goedkeuren</option>
                <option value="sluiten">Sluiten</option>
                <i class="fa-solid fa-gear" aria-label="Wijzigen optie"></i>
            </select>
            </td>
        </tr>
        {%endfor%}
    </table>
</body>
</html>
